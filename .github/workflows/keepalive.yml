name: Supabase keep-alive

# Contrôle de disponibilité Auth du projet réellement référencé par le frontend.
# Il ne valide ni l'authentification utilisateur, ni les droits RLS.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/keepalive.yml
      - scripts/check-services.mjs

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-services.mjs
